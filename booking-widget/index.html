<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a tasting | Kettle &amp; Leaf</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="widget.css">
  <!-- No GTM here by default. To track inside the widget, add your GTM snippet at this spot. -->
</head>
<body>
  <main class="bw">
    <h1>Book a tasting</h1>
    <p class="bw__sub">A 45-minute guided session for up to 4 people. (Demo widget on its own origin.)</p>
    <form id="booking-form" novalidate>
      <div id="booking-error"></div>
      <label for="bw-date">Date</label>
      <input type="date" id="bw-date" required>
      <label for="bw-slot">Time slot</label>
      <select id="bw-slot" required>
        <option value="">Choose a time</option>
        <option>10:00 AM</option><option>12:00 PM</option><option>3:00 PM</option><option>5:30 PM</option>
      </select>
      <label for="bw-name">Name</label>
      <input type="text" id="bw-name" autocomplete="name" required>
      <label for="bw-email">Email</label>
      <input type="email" id="bw-email" autocomplete="email" required>
      <button type="submit" id="booking-submit" data-track="booking-submit">Book</button>
    </form>
    <p id="booking-done" class="bw__done" hidden></p>
  </main>
  <script src="widget.js"></script>
</body>
</html>
