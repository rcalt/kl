<!doctype html>
<html lang="en" data-page="gifting">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Corporate gifting | Kettle &amp; Leaf</title>
  <meta name="description" content="Tea gifts for your team and clients.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages/content.css">
  <script src="js/config.js"></script>
  <script src="js/boot.js"></script>
  <!-- GTM head snippet: lives in js/partials.js (one place for every page). -->
  <script src="js/partials.js"></script>
</head>
<body>
  <!-- GTM body snippet (noscript iframe): inserted here by js/partials.js. -->
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- Header: injected by js/partials.js -->
  <kl-header></kl-header>
  <main id="main">
    <div class="container">
      <div class="page-title"><h1>Corporate gifting</h1><p>Hand-packed tea gift sets for teams and clients, from 10 to 1,000. Tell us about your team and we will send a quote.</p></div>
      <div class="form-card">
        <form id="gifting-form" novalidate>
          <div id="gifting-error"></div>
          <div class="field"><label for="gift-company">Company</label><input type="text" id="gift-company" autocomplete="organization"></div>
          <div class="field"><label for="gift-name">Your name</label><input type="text" id="gift-name" autocomplete="name"></div>
          <div class="field"><label for="gift-email">Work email</label><input type="email" id="gift-email" autocomplete="email"></div>
          <div class="field"><label for="gift-size">Team size</label>
            <select id="gift-size"><option value="">Choose</option><option value="1-10">1 to 10</option><option value="11-50">11 to 50</option><option value="51-200">51 to 200</option><option value="200+">200+</option></select></div>
          <div class="field"><label for="gift-message">Message</label><textarea id="gift-message"></textarea></div>
          <button type="submit" class="btn btn--primary" id="gifting-submit" data-track="gifting-submit">Request a quote</button>
        </form>
        <div class="alert alert--success" id="gifting-success" role="status" hidden>Thanks <span id="gifting-success-name"></span>! We will be in touch within one business day. (Demo: nothing was sent.)</div>
      </div>
    </div>
  </main>
  <!-- Footer: injected by js/partials.js -->
  <kl-footer></kl-footer>
  <!-- Cart drawer: injected by js/partials.js -->
  <kl-cart-drawer></kl-cart-drawer>

  <!-- Common scripts: identical block on every page -->
  <script src="data/products.js" defer></script>
  <script src="data/seed-users.js" defer></script>
  <script src="data/seed-orders.js" defer></script>
  <script src="data/seed-refunds.js" defer></script>
  <script src="data/seed-reviews.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/services.js" defer></script>
  <script src="js/datalayer.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/consent-mock.js" defer></script>
  <script src="js/demo-panel.js" defer></script>
  <!-- Page script -->
  <script src="js/pages/gifting.js" defer></script>
</body>
</html>
