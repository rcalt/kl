<!doctype html>
<html lang="en" data-page="admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo admin | Kettle &amp; Leaf</title>
  <meta name="description" content="Demo admin for the course.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages/admin.css">
  <script src="js/config.js"></script>
  <script src="js/boot.js"></script>
  <!-- GTM head snippet: lives in js/partials.js (one place for every page). -->
  <script src="js/partials.js"></script>
</head>
<body>
  <!-- GTM body snippet (noscript iframe): inserted here by js/partials.js. -->
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- Header: injected by js/partials.js -->
  <kl-header></kl-header>
  <main id="main">
    <div class="admin-banner" id="admin-banner">Demo admin. No login. Not part of the store.</div>
    <div class="container" style="padding-bottom:3rem">
      <div class="admin-tabs">
        <button type="button" class="btn btn--primary" data-tab="orders" id="admin-tab-orders" data-track="admin-tab-orders">Orders</button>
        <button type="button" class="btn btn--ghost" data-tab="refunds" id="admin-tab-refunds" data-track="admin-tab-refunds">Refunds</button>
        <button type="button" class="btn btn--ghost" data-tab="webhooks" id="admin-tab-webhooks" data-track="admin-tab-webhooks">Webhooks</button>
      </div>
      <section class="admin-panel" data-panel="orders" id="admin-orders"><div class="table-wrap"><table class="table">
        <thead><tr><th>Order</th><th>Email</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="admin-orders-body"></tbody></table></div></section>
      <section class="admin-panel" data-panel="refunds" id="admin-refunds" hidden><div class="table-wrap"><table class="table">
        <thead><tr><th>Refund</th><th>Order</th><th>Amount</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody id="admin-refunds-body"></tbody></table></div></section>
      <section class="admin-panel" data-panel="webhooks" id="admin-webhooks-panel" hidden>
        <p class="muted">Webhooks are sent from the browser (no-cors, text/plain), so the response is opaque. Use <strong>Copy as cURL</strong> to fire the same payload from a terminal for a true server-to-server call.</p>
        <div id="admin-webhooks"></div></section>
    </div>
  </main>
  <!-- Footer: injected by js/partials.js -->
  <kl-footer></kl-footer>
  <!-- Cart drawer: injected by js/partials.js -->
  <kl-cart-drawer></kl-cart-drawer>

  <!-- Common scripts: identical block on every page -->
  <script src="data/products.js" defer></script>
  <script src="data/seed-users.js" defer></script>
  <script src="data/seed-orders.js" defer></script>
  <script src="data/seed-refunds.js" defer></script>
  <script src="data/seed-reviews.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/services.js" defer></script>
  <script src="js/datalayer.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/consent-mock.js" defer></script>
  <script src="js/demo-panel.js" defer></script>
  <!-- Page script -->
  <script src="js/pages/admin.js" defer></script>
</body>
</html>
