<!doctype html>
<html lang="en" data-page="account">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account | Kettle &amp; Leaf</title>
  <meta name="description" content="Your profile and orders.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/pages/account.css">
  <script src="js/config.js"></script>
  <script src="js/boot.js"></script>
  <!-- GTM head snippet: lives in js/partials.js (one place for every page). -->
  <script src="js/partials.js"></script>
</head>
<body>
  <!-- GTM body snippet (noscript iframe): inserted here by js/partials.js. -->
  <a class="skip-link" href="#main">Skip to content</a>
  <!-- Header: injected by js/partials.js -->
  <kl-header></kl-header>
  <main id="main">
    <div class="container" style="padding-bottom:3rem">
      <div class="page-title account-head">
        <div><h1 id="account-name">My account</h1><p class="muted"><span id="account-email"></span> · tier: <span class="badge" id="account-tier"></span></p></div>
        <button type="button" class="btn btn--ghost" id="logout-button" data-track="logout-button">Log out</button>
      </div>
      <h2>My orders</h2>
      <div class="table-wrap"><table class="table" id="orders-table">
        <thead><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table></div>
    </div>
  </main>
  <!-- Footer: injected by js/partials.js -->
  <kl-footer></kl-footer>
  <!-- Cart drawer: injected by js/partials.js -->
  <kl-cart-drawer></kl-cart-drawer>

  <!-- Common scripts: identical block on every page -->
  <script src="data/products.js" defer></script>
  <script src="data/seed-users.js" defer></script>
  <script src="data/seed-orders.js" defer></script>
  <script src="data/seed-refunds.js" defer></script>
  <script src="data/seed-reviews.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/db.js" defer></script>
  <script src="js/services.js" defer></script>
  <script src="js/datalayer.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/consent-mock.js" defer></script>
  <script src="js/demo-panel.js" defer></script>
  <!-- Page script -->
  <script src="js/pages/account.js" defer></script>
</body>
</html>
